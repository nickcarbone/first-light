name: Refresh soundings

# Weekly: find geotagged dawn and outdoor recordings on Freesound near each
# place, and save them to data/soundings.json for the page to use.
on:
  schedule:
    - cron: "17 4 * * 0"   # Sundays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soundings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build soundings.json
        env:
          FREESOUND_TOKEN: ${{ secrets.FREESOUND_TOKEN }}
        run: node scripts/build-soundings.mjs
      - name: Commit if changed
        run: |
          git config user.name "first-light-bot"
          git config user.email "first-light-bot@users.noreply.github.com"
          git add data/soundings.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh soundings"
            git push
          fi
